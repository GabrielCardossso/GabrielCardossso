name: Perfil

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    name: Cobrinha de contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#67e8f9
            dist/snake-light.svg?palette=github-light&color_snake=#0284c7&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0369a1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-dna:
    name: Code DNA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Sem o secret PROFILE_TOKEN (PAT com leitura dos seus repositórios e das organizações),
      # a coleta é pulada e o dashboard fica com o último snapshot gerado localmente.
      - name: Gerar estatísticas e SVGs
        run: node scripts/collect-stats.mjs && node scripts/render-svgs.mjs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_EMAILS: ${{ secrets.PROFILE_EMAILS }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: atualiza Code DNA" && git push)
