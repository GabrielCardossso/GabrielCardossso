name: Perfil

on:
  schedule:
    # A cada 3h (inclui 00:05 em Brasília), para a streak virar logo depois da meia-noite.
    - cron: "5 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  perfil:
    name: Cobrinha, Code DNA e streak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A cobrinha é gerada em assets/ e embutida no card de contribuições pelo render-svgs.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#d97757&color_dots=#2d2a27,#5c3426,#8a4a33,#c0643f,#f2a07f

      # Sem o secret PROFILE_TOKEN (PAT com leitura dos seus repositórios e das organizações),
      # a coleta do Code DNA é pulada (a streak usa só dados públicos) e o dashboard fica com o último snapshot gerado localmente.
      - name: Gerar estatísticas, streak e SVGs
        run: node scripts/collect-stats.mjs && node scripts/collect-streak.mjs && node scripts/render-svgs.mjs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_EMAILS: ${{ secrets.PROFILE_EMAILS }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: atualiza perfil" && git push)
