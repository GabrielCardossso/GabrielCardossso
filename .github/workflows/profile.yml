name: Perfil

on:
  schedule:
    # A cada 3h (inclui 00:05 em Brasília), para a streak virar logo depois da meia-noite.
    - cron: "5 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    name: Cobrinha de contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#d97757&color_dots=#2d2a27,#5c3426,#8a4a33,#c0643f,#f2a07f
            dist/snake-light.svg?palette=github-light&color_snake=#c15f3c&color_dots=#ebedf0,#f6d3c4,#eea98d,#d97757,#9c4a2f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-dna:
    name: Code DNA e streak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Sem o secret PROFILE_TOKEN (PAT com leitura dos seus repositórios e das organizações),
      # a coleta do Code DNA é pulada (a streak usa só dados públicos) e o dashboard fica com o último snapshot gerado localmente.
      - name: Gerar estatísticas, streak e SVGs
        run: node scripts/collect-stats.mjs && node scripts/collect-streak.mjs && node scripts/render-svgs.mjs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_EMAILS: ${{ secrets.PROFILE_EMAILS }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: atualiza perfil" && git push)
