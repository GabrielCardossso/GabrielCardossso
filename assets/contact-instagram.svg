<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="600 0 300 200" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Instagram</title>
<desc id="desc">Contato</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
