<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Contribuições</title>
<desc id="desc">a cobrinha come os dias com commit</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="112" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="112" fill="#191817"/>
<rect width="1200" height="112" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">contribuicoes — último ano</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Contribuições</text>
<text x="1152" y="88" text-anchor="end" class="mono" font-size="14" fill="#86817a">a cobrinha come os dias com commit</text>
<rect width="1200" height="112" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="111" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
