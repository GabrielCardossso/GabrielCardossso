<svg xmlns="http://www.w3.org/2000/svg" width="290" height="64" viewBox="0 0 290 64" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">WhatsApp</title>
<desc id="desc">WhatsApp</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="290" height="64" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="290" height="64" fill="#191817"/>
<rect width="290" height="64" fill="url(#grid)"/>

<image href="data:image/svg+xml;base64," x="22" y="20" width="24" height="24"/>
<text x="60" y="38" class="mono" font-size="17" font-weight="700" fill="#ece9e4">WhatsApp</text>

<text x="268" y="38" text-anchor="end" class="mono" font-size="18" fill="#d97757">↗</text>
<rect width="290" height="64" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="289" height="63" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
