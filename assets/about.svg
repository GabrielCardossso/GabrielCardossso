<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="447" viewBox="0 0 1200 447" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Sobre Gabriel Cardoso</title>
<desc id="desc">Estagiário de desenvolvimento Full Stack na Getel Tecnologia, onde participo da construção de sistemas de gestão de ponta a ponta, do modelo de dados à interface. No back-end, trabalho no dia a dia com Node.js e NestJS, além de Java e Spring Boot; no front, com TypeScript, React e Next.js. Uso IA (Claude e ChatGPT) como parte do meu fluxo de desenvolvimento. Gosto de software que resolve problema de negócio de verdade: ERPs, CRMs, controle de ponto e estoque.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
