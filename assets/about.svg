<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">gestão de ponta a ponta, do modelo de dados à interface. No back-end, trabalho no dia a dia com<tspan font-weight="700" fill="#ece9e4"> Node.js</tspan><tspan font-weight="700" fill="#ece9e4"> e</tspan></text>
<text x="70" y="176" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">NestJS</tspan> , além de<tspan font-weight="700" fill="#ece9e4"> Java</tspan><tspan font-weight="700" fill="#ece9e4"> e</tspan><tspan font-weight="700" fill="#ece9e4"> Spring</tspan><tspan font-weight="700" fill="#ece9e4"> Boot</tspan> ; no front, com<tspan font-weight="700" fill="#ece9e4"> TypeScript,</tspan><tspan font-weight="700" fill="#ece9e4"> React</tspan><tspan font-weight="700" fill="#ece9e4"> e</tspan><tspan font-weight="700" fill="#ece9e4"> Next.js</tspan> . Uso IA (<tspan font-weight="700" fill="#ece9e4"> Claude</tspan> e<tspan font-weight="700" fill="#ece9e4"> ChatGPT</tspan> )</text>
